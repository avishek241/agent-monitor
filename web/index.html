<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Agent Deck</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/Doto.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="styles.css">
<script>/* apply the saved theme before first paint (no flash); theme.js owns the logic afterwards */
try { var t = (JSON.parse(localStorage.getItem("deck.theme") || "{}") || {}).theme || "deck",
    dark = t === "paper-dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches),
    set = t === "mission" ? "mission" : /^paper|^auto$/.test(t) ? "paper" : "deck";
  document.documentElement.setAttribute("data-theme", set); document.documentElement.setAttribute("data-mode", dark ? "dark" : "light"); } catch (e) {}
</script>
</head>
<body data-view="overview">
<main id="app" aria-live="polite"><div class="empty">Loading…</div></main>
<div id="toast" class="toast" role="status"></div>
<noscript>Agent Deck needs JavaScript.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
